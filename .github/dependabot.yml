# Keeps the dependency tree and the CI actions patched without anyone remembering to check.
# Weekly rather than daily: this is a service, not a library — batching updates into one review
# a week beats a trickle of single-bump PRs.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
